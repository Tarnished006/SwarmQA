                - /url: "#other-clients"
                - text: "#"
            - paragraph [ref=e110]: The standard configuration works with most MCP clients, including Windsurf, Cline, Goose, Kiro, Codex, Copilot CLI, and others. Consult your client's MCP documentation for where to place the config.
            - heading [level=3] [ref=e111]:
              - text: First interaction
              - link "Direct link to First interaction" [ref=e112] [cursor=pointer]:
                - /url: "#first-interaction"
                - text: "#"
            - paragraph [ref=e113]: "Once the server is connected, ask your AI assistant to interact with a web page:"
            - code [ref=e117]:
              - generic [ref=e118]: Navigate to https://demo.playwright.dev/todomvc and add a few todo items.
            - paragraph [ref=e119]: The assistant will use Playwright MCP tools to open the browser, navigate to the page, and interact with elements — all through structured accessibility snapshots rather than screenshots.
            - heading [level=2] [ref=e120]:
              - text: Core Features
              - link "Direct link to Core Features" [ref=e121] [cursor=pointer]:
                - /url: "#core-features"
                - text: "#"
            - heading [level=3] [ref=e122]:
              - text: Accessibility snapshots
              - link "Direct link to Accessibility snapshots" [ref=e123] [cursor=pointer]:
                - /url: "#accessibility-snapshots"
                - text: "#"
            - paragraph [ref=e124]: "Playwright MCP operates on the page's accessibility tree, not pixels. When a tool runs, it returns a structured snapshot showing the page elements, their roles, and text content. The LLM uses element references from these snapshots to interact with the page:"
            - code [ref=e128]:
              - generic [ref=e129]: "- heading \"todos\" [level=1]"
              - generic [ref=e130]: "- textbox \"What needs to be done?\" [ref=e5]"
              - generic [ref=e131]: "- listitem:"
              - generic [ref=e132]: "- checkbox \"Toggle Todo\" [ref=e10]"
              - generic [ref=e133]: "- text: \"Buy groceries\""
            - paragraph [ref=e134]:
              - text: The LLM reads this snapshot and uses
              - code [ref=e135]: ref=e5
              - text: to type into the textbox or
              - code [ref=e136]: ref=e10
              - text: to check the checkbox.
            - heading [level=3] [ref=e137]:
              - text: Interacting with pages
              - link "Direct link to Interacting with pages" [ref=e138] [cursor=pointer]:
                - /url: "#interacting-with-pages"
                - text: "#"
            - paragraph [ref=e139]: "Playwright MCP provides tools for all common browser interactions:"
            - list [ref=e140]:
              - listitem [ref=e141]:
                - strong [ref=e142]: Navigation
                - text: ": Open URLs, go back/forward, reload pages."
              - listitem [ref=e143]:
                - strong [ref=e144]: Clicking and typing
                - text: ": Click elements, type text, fill forms, select dropdowns."
              - listitem [ref=e145]:
                - strong [ref=e146]: Screenshots
                - text: ": Capture the current page or specific elements for visual verification."
              - listitem [ref=e147]:
                - strong [ref=e148]: Keyboard and mouse
                - text: ": Press keys, hover, drag and drop."
              - listitem [ref=e149]:
                - strong [ref=e150]: Dialogs
                - text: ": Accept or dismiss browser dialogs."
              - listitem [ref=e151]:
                - strong [ref=e152]: Tabs
                - text: ": Create, close, and switch between browser tabs."
            - heading [level=3] [ref=e153]:
              - text: Running Playwright code
              - link "Direct link to Running Playwright code" [ref=e154] [cursor=pointer]:
                - /url: "#running-playwright-code"
                - text: "#"
            - paragraph [ref=e155]:
              - text: For complex interactions that go beyond individual tool calls, use the
              - code [ref=e156]: browser_run_code_unsafe
              - text: "tool to execute Playwright scripts directly. This tool runs arbitrary JavaScript in the Playwright server process and is RCE-equivalent — only enable it for trusted MCP clients:"
            - code [ref=e160]:
              - generic [ref=e161]: "Run this Playwright code to verify the todo count:"
              - generic [ref=e162]: "async (page) => {"
              - generic [ref=e163]: const count = await page.getByTestId('todo-count').textContent();
              - generic [ref=e164]: return count;
              - generic [ref=e165]: "}"
            - heading [level=3] [ref=e166]:
              - text: Network monitoring and mocking
              - link "Direct link to Network monitoring and mocking" [ref=e167] [cursor=pointer]:
                - /url: "#network-monitoring-and-mocking"
                - text: "#"
            - paragraph [ref=e168]: "Inspect network traffic and mock API responses:"
            - list [ref=e169]:
              - listitem [ref=e170]:
                - strong [ref=e171]: View network requests
                - text: ": List all requests made since page load."
              - listitem [ref=e172]:
                - strong [ref=e173]: Mock routes
                - text: ": Set up URL pattern matching to return custom responses."
              - listitem [ref=e174]:
                - strong [ref=e175]: Console messages
                - text: ": Access browser console output for debugging."
            - heading [level=3] [ref=e176]:
              - text: Storage state
              - link "Direct link to Storage state" [ref=e177] [cursor=pointer]:
                - /url: "#storage-state"
                - text: "#"
            - paragraph [ref=e178]: "Save and restore browser state including cookies and localStorage:"
            - list [ref=e179]:
              - listitem [ref=e180]:
                - strong [ref=e181]: Save state
                - text: ": Persist authentication and session data to a file."
              - listitem [ref=e182]:
                - strong [ref=e183]: Restore state
                - text: ": Load previously saved state into a new session."
              - listitem [ref=e184]:
                - strong [ref=e185]: Cookie management
                - text: ": List, get, set, and delete individual cookies."
            - heading [level=2] [ref=e186]:
              - text: Configuration
              - link "Direct link to Configuration" [ref=e187] [cursor=pointer]:
                - /url: "#configuration"
                - text: "#"
            - heading [level=3] [ref=e188]:
