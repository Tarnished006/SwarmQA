            - paragraph [ref=e45]:
              - text: The Playwright MCP server provides browser automation capabilities through the
              - link "Model Context Protocol" [ref=e46] [cursor=pointer]:
                - /url: https://modelcontextprotocol.io
              - text: ", enabling LLMs to interact with web pages using structured accessibility snapshots. It works with VS Code, Cursor, Windsurf, Claude Desktop, and any other MCP client — no vision models required."
