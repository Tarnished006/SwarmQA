              - text: User profile
              - link "Direct link to User profile" [ref=e230] [cursor=pointer]:
                - /url: "#user-profile"
                - text: "#"
            - paragraph [ref=e231]: "Playwright MCP supports three profile modes:"
            - list [ref=e232]:
              - listitem [ref=e233]:
                - strong [ref=e234]: Persistent (default)
                - text: ": Login state and cookies are preserved between sessions. The profile is stored in"
                - code [ref=e235]: "ms-playwright/mcp-{channel}-{workspace-hash}"
                - text: in your platform's cache directory, so different projects get separate profiles automatically. Override with
                - code [ref=e236]: "--user-data-dir"
                - text: .
              - listitem [ref=e237]:
                - strong [ref=e238]: Isolated
                - text: ": Each session starts fresh. Pass"
                - code [ref=e239]: "--isolated"
                - text: to enable. You can load initial state with
                - code [ref=e240]: "--storage-state"
                - text: .
              - listitem [ref=e241]:
                - strong [ref=e242]: Browser extension
                - text: ": Connect to your existing browser tabs with the"
                - link "Playwright Extension" [ref=e243] [cursor=pointer]:
                  - /url: https://github.com/microsoft/playwright/blob/main/packages/extension/README.md
                - text: . Pass
                - code [ref=e244]: "--extension"
                - text: to enable.
            - heading [level=3] [ref=e245]:
              - text: Configuration file
              - link "Direct link to Configuration file" [ref=e246] [cursor=pointer]:
                - /url: "#configuration-file"
                - text: "#"
            - paragraph [ref=e247]: "For advanced configuration, use a JSON config file:"
            - code [ref=e251]:
              - generic [ref=e252]: npx @playwright/mcp@latest --config path/to/config.json
            - paragraph [ref=e253]:
              - text: The config file supports browser options, context options, network rules, timeouts, and more. See the
              - link "Playwright MCP repository" [ref=e254] [cursor=pointer]:
                - /url: https://github.com/microsoft/playwright-mcp/blob/main/config.d.ts
              - text: for the full schema.
            - heading [level=3] [ref=e255]:
