                - /url: "#standalone-server"
                - text: "#"
            - paragraph [ref=e257]: "When running a headed browser on a system without a display or from IDE worker processes, start the MCP server separately with HTTP transport:"
            - code [ref=e261]:
              - generic [ref=e262]: npx @playwright/mcp@latest --port 8931
            - paragraph [ref=e263]: "Then point your MCP client to the HTTP endpoint:"
