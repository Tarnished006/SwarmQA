              - link "Direct link to Headed mode" [ref=e189] [cursor=pointer]:
                - /url: "#headed-mode"
                - text: "#"
            - paragraph [ref=e190]: "By default, Playwright MCP runs the browser in headed mode so you can see what's happening. To run headless:"
            - code [ref=e194]:
              - generic [ref=e195]: "{"
              - generic [ref=e196]: "\"mcpServers\": {"
              - generic [ref=e197]: "\"playwright\": {"
              - generic [ref=e198]: "\"command\": \"npx\","
              - generic [ref=e199]: "\"args\": ["
              - generic [ref=e200]: "\"@playwright/mcp@latest\","
              - generic [ref=e201]: "\"--headless\""
              - generic [ref=e202]: "]"
              - generic [ref=e203]: "}"
              - generic [ref=e204]: "}"
              - generic [ref=e205]: "}"
            - heading [level=3] [ref=e206]:
              - text: Browser selection
              - link "Direct link to Browser selection" [ref=e207] [cursor=pointer]:
                - /url: "#browser-selection"
                - text: "#"
            - paragraph [ref=e208]: "Choose which browser to use:"
            - code [ref=e212]:
              - generic [ref=e213]: "{"
              - generic [ref=e214]: "\"mcpServers\": {"
              - generic [ref=e215]: "\"playwright\": {"
